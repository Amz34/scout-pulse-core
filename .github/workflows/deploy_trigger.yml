name: Autonomous ScoutPulse CI/CD Infra Trigger

on:
  push:
    branches: [ main, develop ]
  schedule:
    - cron: '*/15 * * * *'  # Real-time event-driven trigger
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Specific GitHub target repository to audit & deploy'
        required: false
        default: 'auto-discover'

jobs:
  audit-ca-rea-egm:
    name: CA/REA/EGM Enterprise Verification & Infra Dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 pydantic

      - name: Run EGM Governance & Security Audit Tests
        run: |
          python -m pytest tests/ -v

      - name: Execute Autonomous Deployment Trigger
        run: |
          PYTHONPATH=. python3 src/dispatch_trigger.py
